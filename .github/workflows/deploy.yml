name: Deploy nicoswan.com site

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Github pages
  build-pages:
    name: Build Github pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: setup
        uses: ./.github/actions/setup-node

      - name: Build
        env:
          BUILD_TYPE: static
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          echo "Building $BUILD_TYPE"
          ${{ steps.setup.outputs.runner }} next build
        shell: bash

      - name: Upload artifact for Gitbub pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy-pages:
    name: Deploy to Github pages
    environment:
      name: github-pages
      url: 'https://nico-swan-com.github.io'
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Cpanel
  build-cpanel:
    name: Build standalone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: setup
        uses: ./.github/actions/setup-node

      - name: Build
        env:
          BUILD_TYPE: standalone
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          echo "Building $BUILD_TYPE"
          ${{ steps.setup.outputs.manager }} run build:standalone
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-standalone-artifacts
          path: |
            ./_next
            ./node_modules
            ./server.js
            ./package.json
            ./package-lock.json
            ./public
            ./next.config.ts

  deploy-cpanel:
    name: Deploy to cpanel
    runs-on: ubuntu-latest
    environment: production
    needs: build-cpanel
    steps:
      - name: Download standalone build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-standalone-artifacts

      - name: Deploy to cPanel via FTP
        id: deployment
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/nicoswan/website-next-app/
          protocol: ftp
          timeout: 300000
