name: Deploy production nicoswan.com site

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      deploy_cpanel:
        description: 'Deploy standalone build to cPanel'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup and audit dependencies
        uses: ./.github/actions/setup-node

  # Github pages
  build-pages:
    name: Build Github pages
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        id: setup
        uses: ./.github/actions/setup-node

      - name: Build
        env:
          BUILD_TYPE: static
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CV_GATE_URL: ${{ vars.NEXT_PUBLIC_CV_GATE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          echo "Building $BUILD_TYPE"
          ${{ steps.setup.outputs.runner }} next build
        shell: bash

      - name: Upload artifact for Gitbub pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy-pages:
    name: Deploy to Github pages
    environment:
      name: github-pages
      url: 'https://nico-swan-com.github.io'
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Cpanel
  build-cpanel:
    name: Build standalone
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_cpanel }}
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        id: setup
        uses: ./.github/actions/setup-node

      - name: Build
        env:
          BUILD_TYPE: standalone
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CV_GATE_URL: ${{ vars.NEXT_PUBLIC_CV_GATE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          echo "Building $BUILD_TYPE"
          ${{ steps.setup.outputs.manager }} run build:standalone
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-standalone-artifacts
          path: |
            ./_next
            ./node_modules
            ./server.js
            ./package.json
            ./package-lock.json
            ./public
            ./next.config.ts

  deploy-cpanel:
    name: Deploy to cpanel
    runs-on: ubuntu-latest
    environment: production
    needs: build-cpanel
    steps:
      - name: Download standalone build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-standalone-artifacts

      - name: Deploy to cPanel via FTP
        id: deployment
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/nicoswan/website-next-app/
          protocol: ftp
          timeout: 300000

  # Kubernetes
  publish-dockerhub:
    name: Build Publish docker image to docker hub (nicoswan/nicoswan-com)
    needs: audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            nicoswan/nicoswan-com
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CV_GATE_URL=${{ vars.NEXT_PUBLIC_CV_GATE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
